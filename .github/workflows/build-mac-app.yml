name: Build Mac App

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Mac Package
        run: npm run desktop:mac:dmg

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: babin-rentals-sticker-mac
          path: |
            release/*.dmg
            release/*.zip
            release/mac*
